<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course | Telecom Digital Hub</title><meta name="description" content="Free telecom engineering lessons and learning activities."><link rel="stylesheet" href="css/courses.css"></head><body><header><strong>TELECOM DIGITAL HUB</strong><nav><a href="/courses.html">All Courses</a><a href="/academy.html">Academy</a><a href="/profile.html">My Profile</a></nav></header><main><a href="courses.html">← All courses</a><div id="course-root"></div></main><script type="module">import{courses}from'./js/course-data.js';import{initCourseEnrollment}from'./js/course-enrollment.js';const c=courses.find(x=>x.id===new URLSearchParams(location.search).get('id'));const root=document.querySelector('#course-root');if(!c){root.textContent='Course not found.';}else{document.title=c.title+' | Telecom Digital Hub';const key='tdh-course-progress-v1-'+c.id;let done=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');done=Array.isArray(saved)?saved.filter(x=>Number.isInteger(x)&&x>=0&&x<c.lessons.length):[]}catch{}let active=0;root.innerHTML='<div class="eyebrow" id="level"></div><h1 id="heading"></h1><p class="lead" id="desc"></p><div class="meta" id="count"></div><div class="progress"><div id="bar"></div></div><section class="panel" style="margin-top:20px"><h2>Course enrollment</h2><p class="notice">Optional: Enrolling shares your name, email, course and lesson progress with the site administrator. You can study without enrolling; progress then stays only in this browser.</p><button class="btn" id="enroll">Sign in to enroll</button><p id="enroll-status" role="status"></p></section><div class="columns"><aside class="panel"><h2>Lessons</h2><div class="lesson-list" id="lessons"></div></aside><article class="panel"><div class="eyebrow" id="step"></div><h2 id="lesson-title"></h2><div class="lesson-body" id="body"></div><h3>Learning check</h3><p id="check"></p><button class="btn" id="complete">Mark lesson complete</button><p class="notice">Completion is self-reported and saved only on this device.</p></article></div><div class="panel" style="margin-top:24px"><h2>Ready to test your knowledge?</h2><p>Visit the Academy and select the matching assessment: <strong id="exam"></strong>.</p><a class="btn" href="academy.html">Open Academy</a><p class="notice">Completing lessons does not automatically award a certificate. Academy assessments have separate requirements.</p></div>';const $=id=>document.getElementById(id);$('level').textContent=c.category+' · '+c.level+' · '+c.duration;$('heading').textContent=c.title;$('desc').textContent=c.description;$('exam').textContent=c.exam;function render(){const n=done.length;$('count').textContent=n+' of '+c.lessons.length+' lessons marked complete';$('bar').style.width=(100*n/c.lessons.length)+'%';$('lessons').replaceChildren();c.lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson';b.setAttribute('aria-current',String(i===active));b.textContent=(done.includes(i)?'✓ ':'○ ')+(i+1)+'. '+l[0];b.addEventListener('click',()=>{active=i;render()});$('lessons').append(b)});const l=c.lessons[active];$('step').textContent='Lesson '+(active+1)+' of '+c.lessons.length;$('lesson-title').textContent=l[0];$('body').replaceChildren();const p=document.createElement('p');p.textContent=l[1];$('body').append(p);$('check').textContent=l[2];$('complete').textContent=done.includes(active)?'Completed ✓':'Mark lesson complete';$('complete').disabled=done.includes(active)}$('complete').addEventListener('click',()=>{if(!done.includes(active)){done.push(active);try{localStorage.setItem(key,JSON.stringify(done))}catch{}if(active<c.lessons.length-1)active++;render();enrollment.save()}});const enrollment=initCourseEnrollment(c,{status:$('enroll-status'),button:$('enroll'),completed:done,refresh:()=>{try{localStorage.setItem(key,JSON.stringify(done))}catch{}render()}});render()}</script></body></html>
