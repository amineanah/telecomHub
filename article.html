<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Read telecom engineering articles and guides on TelecomHub.">
<title>Telecom Article | TelecomHub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f6fc;color:#193451;font:16px/1.75 system-ui,-apple-system,Segoe UI,Arial}
header{background:#071b32;padding:18px max(20px,calc((100vw - 980px)/2))}header a{color:#d3edff;font-weight:800;text-decoration:none}
main{max-width:980px;margin:32px auto;padding:0 18px 60px}.article-page{background:white;border:1px solid #d3e1ef;border-radius:18px;padding:clamp(22px,4vw,54px);box-shadow:0 10px 34px #15385d12}h1{font-size:clamp(28px,4vw,47px);line-height:1.2;color:#073c70;margin:12px 0 20px;overflow-wrap:anywhere}h2{font-size:24px;color:#0a4e86;margin:26px 0 12px}.category{font-size:12px;color:#066ab1;letter-spacing:.14em;font-weight:800;text-transform:uppercase}.summary{font-size:19px;color:#4d6884;border-left:4px solid #2184ce;padding-left:17px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.9;margin-top:32px}.cover{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:12px;margin:26px 0}.media{display:grid;gap:22px;margin-top:25px}.asset{border:1px solid #d6e2ef;border-radius:14px;padding:16px;background:#f7fbff;overflow:hidden}.asset h3{font-size:17px;margin:0 0 12px;color:#0b4277}.asset img{max-width:100%;height:auto;max-height:600px;object-fit:contain;border-radius:8px}.asset iframe{display:block;width:100%;border:0;border-radius:9px;aspect-ratio:16/9;background:#06182d}.asset iframe.pdf-frame{aspect-ratio:auto;height:620px}.asset video{max-width:100%;width:100%;border-radius:9px;background:#081324}.asset a{color:#0762ae;font-weight:800;overflow-wrap:anywhere}.msg{padding:18px;background:#e4f0fb;border-radius:10px;color:#164d7a}footer{text-align:center;background:#081d34;color:#c4ddf2;padding:28px}footer a{color:#a9d6ff}
</style></head><body><header><a href="/">← TelecomHub · Knowledge Hub</a></header><main><div id="loading" class="msg" role="status">Loading article…</div><article id="article" class="article-page" hidden><div id="category" class="category"></div><h1 id="title"></h1><p id="summary" class="summary"></p><img id="cover" class="cover" hidden alt=""><div id="content" class="body"></div><section id="media" class="media" aria-label="Article media and resources"></section></article></main><footer><a href="/">Home</a> · <a href="privacy-policy.html">Privacy Policy</a> · <a href="contact.html">Contact</a></footer>
<script type="module">
import {auth} from "./js/firebase-config.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const labels={"5g":"5G Networks",ran:"RAN & Radio",fiber:"Fiber Optics",ehs:"EHS & Quality",site:"Site Engineering",ai:"AI & Automation",tools:"Tools & Practical",core:"Core & Transport",power:"Power & IoT"};
const $=id=>document.getElementById(id);
function httpsUrl(raw){if(typeof raw!=="string")return null;try{const u=new URL(raw);return u.protocol==="https:"?u.href:null;}catch{return null;}}
function youtubeId(raw){try{const u=new URL(raw);if(u.hostname==="youtu.be")return /^[\w-]{11}$/.test(u.pathname.slice(1))?u.pathname.slice(1):null;if(["youtube.com","www.youtube.com","m.youtube.com","www.youtube-nocookie.com"].includes(u.hostname)){const id=u.searchParams.get("v")||u.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/)?.[1];return /^[\w-]{11}$/.test(id||"")?id:null;}}catch{}return null;}
function mediaAsset(item){
if(!item||typeof item.title!=="string"||typeof item.url!=="string")return null;
const url=httpsUrl(item.url);if(!url)return null;
const wrap=document.createElement("div");wrap.className="asset";const h=document.createElement("h3");h.textContent=item.title;wrap.append(h);
let node;
if(item.type==="image"){node=document.createElement("img");node.src=url;node.alt=item.title;node.loading="lazy";}
else if(item.type==="youtube"){const id=youtubeId(url);if(!id)return null;node=document.createElement("iframe");node.src="https://www.youtube-nocookie.com/embed/"+id;node.title=item.title;node.loading="lazy";node.allow="accelerometer; encrypted-media; picture-in-picture";node.allowFullscreen=true;node.referrerPolicy="strict-origin-when-cross-origin";}
else if(item.type==="video"){node=document.createElement("video");node.controls=true;node.preload="metadata";node.src=url;}
else if(item.type==="pdf"){node=document.createElement("div");const iframe=document.createElement("iframe");iframe.className="pdf-frame";iframe.src=url;iframe.title=item.title;iframe.loading="lazy";const link=document.createElement("a");link.href=url;link.textContent="Open or download PDF ↗";link.target="_blank";link.rel="noopener noreferrer";node.append(iframe,link);}
else if(item.type==="link"){node=document.createElement("a");node.href=url;node.textContent="Open resource ↗";node.target="_blank";node.rel="noopener noreferrer";}
else return null;
wrap.append(node);return wrap;
}
const id=new URLSearchParams(location.search).get("id");
if(!id||!/^[a-zA-Z0-9_-]{1,150}$/.test(id)){$("loading").textContent="Invalid article link.";}
else try{
const snap=await getDoc(doc(getFirestore(auth.app),"articles",id));
if(!snap.exists()||snap.data().status!=="published"){$("loading").textContent="This article is unavailable or has not been published.";}
else{
const d=snap.data();$("category").textContent=labels[d.category]||"Telecom engineering";$("title").textContent=d.title||"Untitled";$("summary").textContent=d.summary||"";$("content").textContent=d.body||"";
document.title=(d.title||"Article")+" | TelecomHub";
const cover=httpsUrl(d.coverUrl);if(cover){$("cover").src=cover;$("cover").alt="Cover image for "+d.title;$("cover").hidden=false;}
if(Array.isArray(d.media))d.media.slice(0,20).forEach(x=>{const element=mediaAsset(x);if(element)$("media").append(element);});
$("article").hidden=false;$("loading").hidden=true;
}}
catch(e){console.error(e);$("loading").textContent="Could not load this article. Please try again later.";}
</script></body></html>
