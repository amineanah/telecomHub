<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Certificate Recovery | Telecom Digital Hub</title><style>
:root{font:16px system-ui;color-scheme:dark}body{margin:0;background:#091729;color:#e9f2ff}main{max-width:760px;margin:40px auto;padding:24px}section{background:#14263d;border:1px solid #35516f;border-radius:14px;padding:24px;margin:20px 0}h1{font-size:28px}label{display:block;margin:14px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;background:#091729;color:white;border:1px solid #6481a0;border-radius:7px;font:inherit}button{background:#2084d4;color:white;border:0;border-radius:8px;padding:12px 18px;margin-top:16px;cursor:pointer;font-weight:700}button:disabled{opacity:.5}a{color:#8bd0ff}.muted{color:#b5c7da}#message{white-space:pre-wrap;overflow-wrap:anywhere}#details{display:none}</style></head><body><main><p><a href="/profile.html">← My Profile</a></p><h1>Admin Certificate Recovery</h1><p class="muted">Restricted administrator tool. Every restoration is logged. Never upload a service-account JSON to this site.</p><section><p id="session">Checking sign-in…</p><label for="email">Registered learner email</label><input id="email" type="email" autocomplete="off" placeholder="learner@example.com"><button id="lookup" disabled>Find registered user</button><div id="userInfo" aria-live="polite"></div></section><section id="details"><h2>Restore missing certificate</h2><label for="exam">Exam</label><select id="exam"></select><label for="score">Original score (80–100)</label><input id="score" type="number" min="80" max="100" step="1" value="100"><label for="certificateId">Original certificate ID</label><input id="certificateId" required maxlength="80"><label for="completedDate">Original completion date</label><input id="completedDate" type="date"><label for="reason">Recovery reason / supporting evidence reference</label><textarea id="reason" rows="3" maxlength="500" placeholder="Original certificate PDF reviewed"></textarea><button id="restore">Restore certificate</button></section><p id="message" role="status"></p></main>
<script type="module">
import {auth} from './js/firebase-config.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFunctions,httpsCallable} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js';
const ADMIN_UID='wq68WfHSlzW1SNCeyIC2uoNwYvd2';
const EXAMS=['5G NR Fundamentals','LTE / 4G Engineering','RAN Optimization','RF Planning & Design','Telecom Site Quality Control & Acceptance','Telecom EHS & Working at Heights','Fiber Optics & FTTH Engineering'];
const el=id=>document.getElementById(id);const functions=getFunctions(undefined,'us-central1');let selected=null;
EXAMS.forEach(exam=>{const option=document.createElement('option');option.value=exam;option.textContent=exam;el('exam').append(option)});
const msg=text=>el('message').textContent=text;
onAuthStateChanged(auth,user=>{selected=null;el('details').style.display='none';const allowed=user?.uid===ADMIN_UID;el('lookup').disabled=!allowed;el('session').textContent=allowed?'Signed in as authorized administrator.':user?'This account is not authorized for certificate recovery.':'Sign in to your account first, then return here.'});
el('lookup').addEventListener('click',async()=>{el('lookup').disabled=true;selected=null;el('details').style.display='none';el('userInfo').textContent='';msg('Looking up learner…');try{const {data}=await httpsCallable(functions,'lookupCertificateRecoveryUser')({email:el('email').value});selected=data;el('userInfo').textContent='Registered user: '+(data.displayName||'(no display name)')+' — '+data.email+'\nExisting certificates: '+data.certificates.map(c=>c.exam).join(', ');el('userInfo').style.whiteSpace='pre-wrap';el('details').style.display='block';msg('Review existing certificates before restoring.');}catch(e){msg(e.message)}finally{el('lookup').disabled=false}});
el('restore').addEventListener('click',async()=>{if(!selected)return;const exam=el('exam').value,score=Number(el('score').value),certificateId=el('certificateId').value.trim(),completedDate=el('completedDate').value,reason=el('reason').value;if(selected.certificates.some(c=>c.exam===exam||c.certificateId===certificateId)){msg('This exam or certificate ID already exists.');return;}if(!confirm('Restore '+exam+' to '+selected.email+' with score '+score+'% and date '+completedDate+'?'))return;el('restore').disabled=true;msg('Restoring…');try{const {data}=await httpsCallable(functions,'restoreCertificateAdmin')({uid:selected.uid,email:selected.email,exam,score,certificateId,completedDate,reason});msg('Restored successfully. Audit ID: '+data.auditId+'\nAsk learner to refresh My Profile → My Certificates.');el('details').style.display='none';selected=null;}catch(e){msg(e.message)}finally{el('restore').disabled=false}});
</script></body></html>
